<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- NyayaSetu AI Original Logo: Pillar of Justice + Dharma Bridge / Arch -->
  <defs>
    <linearGradient id="nyayaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="nyayaNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circular Shield Frame -->
  <circle cx="50" cy="50" r="46" fill="url(#nyayaNavy)" stroke="url(#nyayaGold)" stroke-width="2.5" />
  
  <!-- Bridge Arch (Setu) Base -->
  <path d="M 22 72 Q 50 48 78 72" fill="none" stroke="url(#nyayaGold)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Scales of Justice / Central Pillar -->
  <line x1="50" y1="20" x2="50" y2="60" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
  <line x1="30" y1="30" x2="70" y2="30" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Scale Pans -->
  <path d="M 26 40 Q 30 46 34 40 Z" fill="url(#nyayaGold)" />
  <line x1="30" y1="30" x2="30" y2="40" stroke="#94a3b8" stroke-width="1.5" />
  
  <path d="M 66 40 Q 70 46 74 40 Z" fill="url(#nyayaGold)" />
  <line x1="70" y1="30" x2="70" y2="40" stroke="#94a3b8" stroke-width="1.5" />
  
  <!-- Central Diamond Apex (AI Wisdom) -->
  <polygon points="50,15 54,21 50,27 46,21" fill="url(#nyayaGold)" />
</svg>

